<html>
<head>
<title>REGISTRATION FORM</title>
</head>

<body>
<h1>Exercise 9: Try to Create Sign Up Form</h1>
<p>Lovely Andrea Manuel</p>

<table border="0" cellspacing="0" height="500" width="450">
<tr>
	<td colspan="2" style="color: yellow" align="left" bgcolor="orange">Sign Up</td>
</tr>	

<tr>
	<td rowspan="1" style="color: yellow" bgcolor="black" align="right" width="150">First Name</td>
	<td bgcolor="black" width="230"><input type="text" placeholder="Enter First Name"></td>
</tr>

<tr>
	<td rowspan="1" style="color: yellow" bgcolor="black" align="right" width="150">Last Name</td>
	<td bgcolor="black" width="230"><input type="text" placeholder="Enter Last Name"></td>
</tr>

<tr>
	<td rowspan="1" style="color: yellow" bgcolor="black" align="right" width="150">Date of Birth</td>
	<td bgcolor="black" width="230">
	<select><option>Date</option></select>
	<select><option>Month</option></select>
	<select><option>Year</option></select>
</tr>

<tr>
	<td rowspan="1" style="color: yellow" bgcolor="black" align="right" width="150">Gender</td>
	<td bgcolor="black" width="230">
	<input type="radio", style="color: yellow"><label style="color: yellow">Male</label>
	<input type="radio"><label style="color: yellow">Female</label>
</tr>

<tr>
	<td rowspan="1" style="color: yellow" bgcolor="black" align="right" width="150">Country</td>
	<td bgcolor="black" width="250">
	<select><option>Contry</option></select>
</tr>
	
<tr>
	<td rowspan="1" style="color: yellow" bgcolor="black" align="right" width="150">E-mail</td>
	<td bgcolor="black" width="230"><input type="email" placeholder="Enter E-mail"></td>
</tr>
	
<tr>
	<td rowspan="1" style="color: yellow" bgcolor="black" align="right" width="150">Phone</td>
	<td bgcolor="black" width="230"><input type="tel" placeholder="Enter Phone"></td>
</tr>

<tr>
	<td rowspan="1" style="color: yellow" bgcolor="black" align="right" width="150">Password</td>
	<td bgcolor="black" width="230"><input type="password"></td>
</tr>

<tr>
	<td rowspan="1" style="color: yellow" bgcolor="black" align="right" width="150">Confirm Password</td>
	<td bgcolor="black" width="230"><input type="password"></td>
</tr>	

<tr>
	<td rowspan="1" style="color: yellow" bgcolor="black" width="150"></td>
	<td rowspan="1" style="color: yellow" bgcolor="black" align="center" width="150"><input type="checkbox">I agree to the Terms of Use</td>
</tr>

<tr>
	<td rowspan="1" bgcolor="orange" width="150" height="70"></td>
	<td bgcolor="orange"  width="250" >
	<button style= "width: 130; height: 55; background-color: green;" >Submit</button>
	<button style= "width: 130; height: 55; background-color: red; " >Cancel</button>
	</td>
</tr>

</table>

</body>
</html>
